# kitty config (stowed from ~/dotfiles). Colours: theme.conf, rendered from
# theme/palette.sh. Per-machine overrides: local.conf (not in the repo).

include theme.conf

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.5
# Plain text, no surprise ligatures (=>, !=, -> stay as typed).
disable_ligatures always

window_padding_width 10 14
cursor_shape         block
cursor_blink_interval 0
scrollback_lines     10000
url_style            straight
enable_audio_bell    no
confirm_os_window_close 0

tab_bar_edge       top
tab_bar_style      separator
tab_separator      " | "
tab_title_template " {index}: {title} "

# globinclude: no error when local.conf does not exist
globinclude local.conf
