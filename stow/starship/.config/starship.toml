# Generated by theme/render.sh from theme/templates/starship.toml.
# Edit the template or theme/palette.sh, not this file.
# Plain, sharp prompt: no powerline/rounded glyphs, no background blocks.
"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
palette = "zen"
format = """
$username$hostname$directory$git_branch$git_state$git_status\
$python$nodejs$docker_context$cmd_duration$jobs$status
$character"""

[palettes.zen]
fg = "#e3d6c9"
dim = "#9a9c8b"
accent = "#f4b585"
red = "#f16e65"
green = "#7ec97e"
yellow = "#efbf71"
blue = "#71b4d6"
magenta = "#e28dc6"
cyan = "#7ec9a3"

[character]
success_symbol = "[>](bold accent)"
error_symbol = "[>](bold red)"
vimcmd_symbol = "[<](bold green)"

[username]
show_always = false
format = "[$user](green)[@](dim)"

[hostname]
ssh_only = true
ssh_symbol = ""
format = "[$hostname](blue) "

[directory]
style = "bold accent"
read_only = " ro"
read_only_style = "red"
truncation_length = 4
truncation_symbol = ".../"

[git_branch]
symbol = ""
format = "[on](dim) [$branch]($style) "
style = "magenta"

[git_state]
style = "bold yellow"

[git_status]
format = "([\\[$all_status$ahead_behind\\]]($style) )"
style = "yellow"

[python]
symbol = "py "
format = "[$symbol$version( $virtualenv)]($style) "
style = "cyan"

[nodejs]
symbol = "node "
format = "[$symbol$version]($style) "
style = "green"

[docker_context]
symbol = "docker "
format = "[$symbol$context]($style) "
style = "blue"

[cmd_duration]
min_time = 2000
format = "[took $duration]($style) "
style = "yellow"

[jobs]
symbol = "jobs "
style = "dim"

[status]
disabled = false
format = "[exit $status]($style) "
style = "red"
